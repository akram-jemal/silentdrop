name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install ".[dev]"
      - name: Lint and check formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Run offline tests
        run: python -m pytest -q -W error
      - name: Build distributions
        run: python -m build
      - name: Install the wheel and smoke-test the CLI
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/silentdrop-smoke"
          python -m venv "$smoke"
          "$smoke/bin/python" -m pip install dist/*.whl
          "$smoke/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$smoke/bin/silentdrop" --help
          test "$("$smoke/bin/silentdrop" --version)" = "$("$smoke/bin/python" -m silentdrop --version)"
          "$smoke/bin/silentdrop" categories
          "$smoke/bin/silentdrop" dataset info
          "$smoke/bin/silentdrop" compare \
            "$GITHUB_WORKSPACE/examples/synthetic-home.json" "$GITHUB_WORKSPACE/examples/synthetic-lab.json"
