name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install ".[dev]"
      - name: Lint and check formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Run offline tests
        run: python -m pytest -q -W error
      - name: Build distributions
        run: python -m build
      - name: Install the wheel and smoke-test the CLI
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/silentdrop-smoke"
          python -m venv "$smoke"
          "$smoke/bin/python" -m pip install dist/*.whl
          "$smoke/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$smoke/bin/silentdrop" --help
          test "$("$smoke/bin/silentdrop" --version)" = "$("$smoke/bin/python" -m silentdrop --version)"
          "$smoke/bin/silentdrop" categories
          "$smoke/bin/silentdrop" dataset info
          "$smoke/bin/silentdrop" doctor
          "$smoke/bin/silentdrop" compare \
            "$GITHUB_WORKSPACE/examples/synthetic-home.json" "$GITHUB_WORKSPACE/examples/synthetic-lab.json"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from silentdrop import __version__

          if os.environ["RELEASE_TAG"] != f"v{__version__}":
              raise SystemExit("The release tag must match the package version.")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          _, _, section = changelog.partition(f"\n## {__version__}\n")
          notes = section.split("\n## ", 1)[0].strip()
          if not notes:
              raise SystemExit("Add a changelog section for this version before releasing.")
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - name: Build distributions
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "SilentDrop $RELEASE_TAG" --notes-file release-notes.md
