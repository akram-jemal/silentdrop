[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "silentdrop"
dynamic = ["version"]
description = "Asynchronous HTTPS connectivity diagnostics for a curated set of websites"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "silentdrop/data/ATTRIBUTION.md"]
dependencies = [
    "aiohttp>=3.12.15,<4",
    "rich>=13.9,<16",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.11,<1",
    "trustme>=1.2,<2",
]

[project.urls]
Repository = "https://github.com/akram-jemal/silentdrop"
Issues = "https://github.com/akram-jemal/silentdrop/issues"

[project.scripts]
silentdrop = "silentdrop.cli:main"

[tool.setuptools.dynamic]
version = {attr = "silentdrop.__version__"}

[tool.setuptools.packages.find]
include = ["silentdrop", "silentdrop.data"]

[tool.setuptools.package-data]
"silentdrop.data" = ["*.csv", "*.md"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]
